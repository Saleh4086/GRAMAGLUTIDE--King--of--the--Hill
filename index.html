<style>

@media(max-width:800px){#hud{gap:4px;top:3px;left:3px;right:3px}.panel{padding:4px 6px;border-width:2px}.playerPanel{width:112px}.scoreLine{font-size:10px}.hearts{font-size:16px}.stageLine{font-size:12px}.bar{height:10px}#controls{bottom:max(5px,calc(env(safe-area-inset-bottom) + 4px));padding:0 max(6px,env(safe-area-inset-left))}.dpad{grid-template-columns:49px 49px 49px;grid-template-rows:49px 49px;gap:3px}.ctrl{width:49px;height:49px;font-size:13px;border-width:2px}.ctrl.action{width:61px;height:55px;font-size:11px}#taunt{top:14vh;right:3vw;padding:9px 12px;font-size:20px;max-width:62vw}}

<body>
<div id="app">
  <div id="title" class="screen active">
    <div id="titleArt" class="art"></div>
    <div class="titleUI">
      <button id="start" class="press">PRESS START / INSERT COIN</button>
      <div class="subtitle">DONKEY-KONG-STYLE CLIMB • ARROWS / A-D • UP/DOWN LADDERS • SPACE JUMP • X SMACK</div>
    </div>
  </div>
  <div id="play" class="screen">
    <div id="stageBg"></div><canvas id="game"></canvas>
    <div id="hud">
      <div class="panel playerPanel"><div class="hearts" id="hearts">♥♥♥</div><div class="scoreLine">SCORE <span id="score">000000</span></div><div class="scoreLine">LIVES <span id="lives">3</span></div></div>
      <div class="panel centerPanel"><div class="stageLine" id="stageName">STAGE 1: SUBURBAN SLOPE</div><div class="scoreLine">GRAMAGLUTIDE</div><div class="bar"><div class="fill" id="bossFill" style="width:100%"></div></div><div class="scoreLine">THICC METER</div><div class="bar"><div class="fill" id="thiccFill" style="width:0%"></div></div></div>
    </div>
    <div id="taunt">GET OVER HERE, FAT ASS!</div>
    <div id="stageCard"><div class="card"><h2 id="cardTitle"></h2><p id="cardSub"></p></div></div>
    <div id="controls">
      <div class="grp dpad"><button class="ctrl up" data-key="ArrowUp">▲</button><button class="ctrl left" data-key="ArrowLeft">◀</button><button class="ctrl down" data-key="ArrowDown">▼</button><button class="ctrl right" data-key="ArrowRight">▶</button></div>
      <div class="grp"><button class="ctrl action" data-key="Space">JUMP</button><button class="ctrl action" data-key="KeyX">SMACK</button></div>
    </div>
  </div>
  <div id="gameOver"><div class="overlayBox"><h1>GAME OVER</h1><div class="stageLine">GRAMAGLUTIDE KEEPS THE HILL</div><button class="press" onclick="location.reload()">TRY AGAIN</button></div></div>
  <div id="win"><div class="overlayBox"><h1>HILL DETHRONED!</h1><div class="stageLine">QUEEN OF CARB CONTROL DEFEATED</div><button class="press" onclick="location.reload()">PLAY AGAIN</button></div></div>
  <div id="scan"></div>
</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const title=document.getElementById('title'),play=document.getElementById('play'),stageBg=document.getElementById('stageBg');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),heartsEl=document.getElementById('hearts'),bossFill=document.getElementById('bossFill'),thiccFill=document.getElementById('thiccFill'),stageName=document.getElementById('stageName');
const taunt=document.getElementById('taunt'),stageCard=document.getElementById('stageCard'),cardTitle=document.getElementById('cardTitle'),cardSub=document.getElementById('cardSub');
const stageDefs=[
 {name:'STAGE 1: SUBURBAN SLOPE',img:'assets/stage1.jpg',boss:8,rate:1.55,sub:'CLIMB THE LADDERS. DODGE THE FOOD.'},
 {name:'STAGE 2: RETIREMENT RIOT',img:'assets/stage2.jpg',boss:10,rate:1.28,sub:'FASTER FOOD. SHORTER BREAKS.'},
 {name:'FINAL STAGE: MOUNT GRAMAGLUTIDE',img:'assets/final.jpg',boss:12,rate:1.05,sub:'GET TO THE TOP AND SMACK HER FOOD BACK.'}
];
const W=1600,H=900,keys={};let state,last=0,running=false,lastTaunt=0,ac=null;
let view={dpr:1,scale:1,tx:0,ty:0};
const platforms=[
 {x1:130,x2:1450,y:805,slope:-.018},
 {x1:180,x2:1390,y:660,slope:.018},
 {x1:150,x2:1440,y:515,slope:-.018},
 {x1:200,x2:1370,y:370,slope:.018},
 {x1:170,x2:1420,y:225,slope:-.012}
];
const ladders=[
 {x:1290,from:0,to:1},{x:310,from:1,to:2},{x:1270,from:2,to:3},{x:350,from:3,to:4}
];
function py(pl,x){return pl.y+pl.slope*(x-pl.x1)}
function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),scale=Math.min(r.width/W,r.height/H);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);view={dpr,scale,tx:(r.width-W*scale)/2,ty:(r.height-H*scale)/2}}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(()=>{resize();window.scrollTo(0,1)},180));if(window.visualViewport)visualViewport.addEventListener('resize',resize);resize();
function reset(){state={stage:0,score:0,lives:3,thicc:0,bossHits:0,time:0,spawn:1,shake:0,player:{x:220,y:700,vx:0,vy:0,w:54,h:78,level:0,onGround:true,climbing:false,ladder:null,inv:0,attack:0,facing:1},hazards:[],fx:[]};setStage(0,true)}
function setStage(n,first=false){state.stage=n;state.bossHits=0;state.hazards=[];state.player.x=220;state.player.level=0;state.player.y=py(platforms[0],220)-state.player.h;state.player.vx=0;state.player.vy=0;state.player.climbing=false;state.thicc=Math.max(0,state.thicc-20);stageBg.style.backgroundImage=`url("${stageDefs[n].img}")`;stageName.textContent=stageDefs[n].name;cardTitle.textContent=stageDefs[n].name;cardSub.textContent=stageDefs[n].sub;stageCard.classList.add('show');setTimeout(()=>stageCard.classList.remove('show'),first?1500:1300)}
async function enterImmersive(){
 try{
   const el=document.documentElement;
   if(el.requestFullscreen && !document.fullscreenElement){await el.requestFullscreen({navigationUI:'hide'}).catch(()=>{});}
 }catch(_){}
 try{window.scrollTo(0,1);setTimeout(()=>window.scrollTo(0,1),120);}catch(_){}
}
function start(e){if(e){e.preventDefault();e.stopPropagation()}if(running)return;enterImmersive();reset();title.classList.remove('active');play.classList.add('active');resize();running=true;last=performance.now();requestAnimationFrame(loop);setTimeout(()=>grandmaYell(true),280)}
const sb=document.getElementById('start');sb.addEventListener('click',start,{passive:false});sb.addEventListener('pointerup',start,{passive:false});
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('.ctrl').forEach(b=>{const k=b.dataset.key;const dn=e=>{e.preventDefault();keys[k]=true;b.classList.add('down')};const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
function beep(freq=160,d=.06){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;g.gain.value=.028;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(_){}}
function grandmaYell(force=false){const now=Date.now();if(!force&&now-lastTaunt<3400)return;lastTaunt=now;taunt.textContent='GET OVER HERE, FAT ASS!';taunt.classList.add('show');setTimeout(()=>taunt.classList.remove('show'),1250);try{if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Get over here, fat ass!');const vs=speechSynthesis.getVoices(),v=vs.find(x=>/Samantha|Victoria|Zira|Ava|Karen|Susan/i.test(x.name));if(v)u.voice=v;u.rate=.77;u.pitch=1.14;u.volume=1;speechSynthesis.speak(u)}catch(_){}}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function nearLadder(p,lad){return Math.abs((p.x+p.w/2)-lad.x)<48}
function update(dt){const s=state,p=s.player,def=stageDefs[s.stage];s.time+=dt;if(p.inv>0)p.inv-=dt;if(p.attack>0)p.attack-=dt;
 const left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD,up=keys.ArrowUp||keys.KeyW,down=keys.ArrowDown||keys.KeyS;
 let speed=285*(1-s.thicc*.0045);speed=Math.max(145,speed);
 if(!p.climbing){if(left){p.vx=-speed;p.facing=-1}else if(right){p.vx=speed;p.facing=1}else p.vx*=Math.pow(.001,dt);
   const ladder=ladders.find(l=>(l.from===p.level||l.to===p.level)&&nearLadder(p,l));
   if(ladder && (up||down)){p.climbing=true;p.ladder=ladder;p.x=ladder.x-p.w/2;p.vx=0;p.vy=0}
   if((keys.Space||keys.ArrowUp&&!ladder)&&p.onGround){p.vy=-470*(1-s.thicc*.003);p.onGround=false;keys.Space=false;beep(430,.04)}
   p.vy+=1050*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
   const pl=platforms[p.level],gy=py(pl,p.x+p.w/2)-p.h;
   if(p.vy>=0&&p.y>=gy){p.y=gy;p.vy=0;p.onGround=true}
   p.x=Math.max(pl.x1-p.w/2,Math.min(pl.x2-p.w/2,p.x));
 }else{
   const l=p.ladder,climbSpeed=230*(1-s.thicc*.0035);p.x=l.x-p.w/2;if(up)p.y-=climbSpeed*dt;if(down)p.y+=climbSpeed*dt;
   const low=Math.min(l.from,l.to),high=Math.max(l.from,l.to),yLow=py(platforms[low],l.x)-p.h,yHigh=py(platforms[high],l.x)-p.h;
   if(l.to>l.from){if(p.y<=yHigh+4){p.level=l.to;p.y=yHigh;p.climbing=false;p.ladder=null;p.onGround=true}else if(p.y>=yLow){p.level=l.from;p.y=yLow;p.climbing=false;p.ladder=null;p.onGround=true}}
   else{if(p.y>=yLow){p.level=l.to;p.y=yLow;p.climbing=false;p.ladder=null;p.onGround=true}}
 }
 if(keys.KeyX&&p.attack<=0){p.attack=.28;keys.KeyX=false;beep(190,.05)}
 // Top platform: close in on Gramaglutide and attack her directly.
 if(p.level===4&&p.x>1180&&p.attack>0){if(!p.didBossHit){p.didBossHit=true;s.bossHits++;s.score+=650;s.shake=11;burst(1285,180);beep(90,.09)}}else p.didBossHit=false;
 s.spawn-=dt;if(s.spawn<=0){spawnFood();s.spawn=def.rate*(.72+Math.random()*.58)}
 for(let i=s.hazards.length-1;i>=0;i--){const h=s.hazards[i];h.x+=h.vx*dt;h.y=py(platforms[h.level],h.x);h.rot+=h.vr*dt;
   // reverse at platform edge and drop one level when possible, like a rolling barrel changing tiers
   const pl=platforms[h.level];if(h.vx<0&&h.x<pl.x1){if(h.level>0){h.level--;h.x=platforms[h.level].x1+15;h.vx=Math.abs(h.vx)*1.03}else{s.hazards.splice(i,1);continue}}else if(h.vx>0&&h.x>pl.x2){if(h.level>0){h.level--;h.x=platforms[h.level].x2-15;h.vx=-Math.abs(h.vx)*1.03}else{s.hazards.splice(i,1);continue}}
   if(p.attack>0&&p.level===h.level&&Math.abs((p.x+p.w/2)-h.x)<82){h.vx=p.facing*500;h.friendly=true;h.rot+=4;s.score+=100}
   if(!h.friendly&&p.level===h.level&&p.inv<=0&&Math.abs((p.x+p.w/2)-h.x)<35&&Math.abs((p.y+p.h)-h.y)<55){hit(h.damage);s.hazards.splice(i,1);continue}
   if(h.friendly&&h.level===4&&h.x>1190){s.bossHits++;s.score+=350;burst(h.x,h.y);s.hazards.splice(i,1);continue}
 }
 if(s.bossHits>=def.boss){s.score+=5000;if(s.stage<stageDefs.length-1)setStage(s.stage+1);else{running=false;document.getElementById('win').style.display='flex'}}
 updateHud();}
function spawnFood(){const types=['DONUT','CAKE','BURGER','PIZZA','TRAY','VIAL'];const type=types[Math.floor(Math.random()*types.length)],lvl=4,pl=platforms[lvl],fromRight=Math.random()>.18;state.hazards.push({type,level:lvl,x:fromRight?1320:1110,y:py(pl,1200),vx:fromRight?-(250+state.stage*38+Math.random()*70):(230+Math.random()*50),rot:0,vr:(Math.random()-.5)*6,damage:type==='VIAL'?22:16,friendly:false});if(Math.random()<.5)grandmaYell()}
function hit(d){const s=state,p=s.player;if(p.inv>0)return;p.inv=1.15;s.thicc=Math.min(100,s.thicc+d);p.vy=-260;p.vx=-p.facing*210;s.shake=14;beep(72,.14);grandmaYell();if(s.thicc>=100){s.lives--;s.thicc=18;p.level=0;p.climbing=false;p.x=220;p.y=py(platforms[0],220)-p.h;p.inv=2;if(s.lives<=0){running=false;document.getElementById('gameOver').style.display='flex'}}}
function burst(x,y){for(let i=0;i<20;i++)state.fx.push({x,y,vx:(Math.random()-.5)*360,vy:(Math.random()-.5)*300,l:.7+Math.random()*.5})}
function updateHud(){scoreEl.textContent=String(state.score).padStart(6,'0');livesEl.textContent=state.lives;heartsEl.textContent='♥'.repeat(Math.max(0,state.lives));bossFill.style.width=Math.max(0,100-state.bossHits/stageDefs[state.stage].boss*100)+'%';thiccFill.style.width=state.thicc+'%'}
function draw(){const s=state,p=s.player,{dpr,scale,tx,ty}=view;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*tx,dpr*ty);ctx.save();if(s.shake>0){ctx.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.86}
 // dark glass underlay for gameplay readability
 ctx.fillStyle='#07020b66';ctx.fillRect(75,125,1450,720);
 // neon girders/platforms
 platforms.forEach((pl,i)=>{ctx.save();ctx.strokeStyle=i===4?'#ffe33a':'#ff3ca8';ctx.lineWidth=18;ctx.shadowBlur=16;ctx.shadowColor=i===4?'#ffe33a':'#ff2dbf';ctx.beginPath();ctx.moveTo(pl.x1,py(pl,pl.x1));ctx.lineTo(pl.x2,py(pl,pl.x2));ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#451235';ctx.lineWidth=6;for(let x=pl.x1+15;x<pl.x2-10;x+=58){const y=py(pl,x);ctx.beginPath();ctx.moveTo(x-22,y-8);ctx.lineTo(x+22,y+8);ctx.stroke()}ctx.restore()});
 // ladders
 ladders.forEach(l=>{const y1=py(platforms[l.from],l.x),y2=py(platforms[l.to],l.x);ctx.strokeStyle='#29e9ff';ctx.lineWidth=8;ctx.shadowBlur=11;ctx.shadowColor='#29e9ff';ctx.beginPath();ctx.moveTo(l.x-22,y1);ctx.lineTo(l.x-22,y2);ctx.moveTo(l.x+22,y1);ctx.lineTo(l.x+22,y2);ctx.stroke();ctx.shadowBlur=0;for(let y=Math.min(y1,y2)+14;y<Math.max(y1,y2)-10;y+=28){ctx.beginPath();ctx.moveTo(l.x-22,y);ctx.lineTo(l.x+22,y);ctx.stroke()}});
 // boss zone + text
 ctx.fillStyle='#16051de6';ctx.strokeStyle='#ffe33a';ctx.lineWidth=4;ctx.fillRect(1120,125,300,92);ctx.strokeRect(1120,125,300,92);ctx.fillStyle='#ffe33a';ctx.font='900 27px Impact';ctx.fillText('GRAMAGLUTIDE',1143,157);ctx.fillStyle='#fff';ctx.font='900 21px Impact';ctx.fillText('GET OVER HERE!',1170,191);
 state.hazards.forEach(drawHazard);drawHero(p);
 for(let i=s.fx.length-1;i>=0;i--){const f=s.fx[i];f.l-=.016;f.x+=f.vx*.016;f.y+=f.vy*.016;f.vy+=280*.016;ctx.globalAlpha=Math.max(0,f.l);ctx.fillStyle=Math.random()>.5?'#ffe45e':'#ff2dbf';ctx.fillRect(f.x,f.y,8,8);if(f.l<=0)s.fx.splice(i,1)}ctx.globalAlpha=1;ctx.restore()}
function drawHero(p){ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);const sx=1+state.thicc/100*.72,sy=1+state.thicc/100*.12;ctx.scale(sx,sy);if(p.inv>0&&Math.floor(p.inv*13)%2===0)ctx.globalAlpha=.35;ctx.fillStyle='#0009';ctx.beginPath();ctx.ellipse(0,42,32,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#282536';ctx.fillRect(-21,18,17,39);ctx.fillRect(4,18,17,39);ctx.fillStyle='#b62e2e';ctx.beginPath();ctx.roundRect(-32,-28,64,56,14);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 23px Impact';ctx.textAlign='center';ctx.fillText(state.thicc>65?'4XL':'2XL',0,8);ctx.fillStyle='#b57859';ctx.fillRect(-43,-18,13,41);ctx.fillRect(30,-18,13,41);ctx.beginPath();ctx.arc(0,-43,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d32663';ctx.fillRect(-22,-57,44,9);ctx.fillStyle='#111';ctx.fillRect(p.facing>0?9:-13,-46,5,5);if(p.attack>0){ctx.strokeStyle='#29e9ff';ctx.lineWidth=8;ctx.beginPath();ctx.arc(p.facing*39,-3,35,-1.3,1.3);ctx.stroke()}ctx.restore()}
function drawHazard(h){ctx.save();ctx.translate(h.x,h.y-22);ctx.rotate(h.rot);ctx.shadowBlur=12;ctx.shadowColor='#000';ctx.font='43px serif';const icon={DONUT:'🍩',CAKE:'🍰',BURGER:'🍔',PIZZA:'🍕',TRAY:'🍗'}[h.type];if(icon){ctx.fillText(icon,-22,18)}else{ctx.shadowColor='#aaff35';ctx.fillStyle='#eaffdf';ctx.fillRect(-9,-25,18,46);ctx.fillStyle='#6cff41';ctx.fillRect(-7,-10,14,24);ctx.fillStyle='#111';ctx.font='bold 8px Arial';ctx.save();ctx.rotate(-Math.PI/2);ctx.fillText('GRAMAGLUTIDE',-20,3);ctx.restore()}ctx.restore()}
