<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GRAMAGLUTIDE: King of the Hill</title>
<style>
:root{
  --pink:#ff2dbf;--cyan:#29e9ff;--yellow:#ffd229;--ink:#09050f;--panel:#0e0815dd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05020a;color:#fff;font-family:Impact,Haettenschweiler,'Arial Narrow Bold',sans-serif;overflow:hidden}
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:#08030d}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.art{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.08) contrast(1.04)}
.art:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,transparent 25%,#0007 100%)}
#titleArt{background-image:url('assets/title.jpg')}
.titleUI{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4vh 3vw 4vh;pointer-events:none}
.press{pointer-events:auto;border:4px solid var(--pink);background:#08030ddd;color:var(--yellow);font:900 clamp(20px,3vw,38px) "Courier New",monospace;padding:14px 28px;box-shadow:0 0 22px #ff2dbfaa,inset 0 0 20px #000;cursor:pointer;text-shadow:3px 3px #7b163d}
.subtitle{margin-top:10px;font:bold 14px "Courier New";letter-spacing:2px;color:#9ef8ff;text-shadow:2px 2px #000}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:1.2vw;right:1.2vw;top:1.2vh;display:flex;gap:12px;align-items:flex-start;z-index:10;pointer-events:none}
.panel{background:linear-gradient(#12091de8,#06030bdd);border:3px solid var(--pink);box-shadow:0 0 14px #ff2dbf88;padding:8px 12px;font-family:"Courier New",monospace}
.playerPanel{width:210px}
.centerPanel{flex:1;max-width:820px}
.stageLine{font-size:clamp(16px,2vw,28px);color:var(--yellow);text-shadow:2px 2px #000}
.scoreLine{font-size:18px;color:#fff}
.hearts{font-size:26px;color:#ff334f;letter-spacing:2px}
.bar{height:18px;background:#1f0b27;border:2px solid #fff;margin-top:5px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#31ff6b,#ffe04d,#ff3f59)}
#bossFill{background:linear-gradient(90deg,#ffce35,#ff3a8c)}
#taunt{position:absolute;right:5vw;top:15vh;z-index:15;background:#fff3dd;color:#121212;border:4px solid #111;border-radius:30px;padding:14px 22px;font:900 clamp(20px,2.8vw,38px) Impact;transform:rotate(-4deg);box-shadow:6px 6px #0008;opacity:0;transition:.18s}
#taunt.show{opacity:1;transform:rotate(-4deg) scale(1.05)}
#stageCard{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:#000b}
#stageCard.show{display:flex}
#stageCard .card{border:4px solid var(--pink);background:#0b0615ee;padding:24px 34px;text-align:center;box-shadow:0 0 35px #ff2dbfaa}
#stageCard h2{margin:0;color:var(--yellow);font:900 clamp(34px,6vw,72px) "Courier New"}
#stageCard p{color:var(--cyan);font:bold clamp(18px,2.4vw,30px) "Courier New"}
#controls{position:absolute;left:0;right:0;bottom:16px;z-index:20;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.grp{display:flex;gap:12px;pointer-events:auto}
.ctrl{width:78px;height:78px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#5e317a,#160723 70%);color:#fff;font:900 18px "Courier New";box-shadow:0 6px #000,0 0 16px #29e9ff77;touch-action:none}
.ctrl.action{border-radius:18px;width:92px;background:radial-gradient(circle at 35% 30%,#ff75da,#821456 70%)}
.ctrl:active,.ctrl.down{transform:translateY(4px);box-shadow:0 2px #000;background:#ff2dbf}
#gameOver,#win{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#06030ddd;text-align:center}
.overlayBox{border:4px solid var(--pink);background:#0c0714ee;padding:28px 36px;box-shadow:0 0 32px #ff2dbf99}
.overlayBox h1{font:900 clamp(42px,7vw,86px) "Courier New";color:var(--yellow);margin:0 0 14px;text-shadow:4px 4px #6f153a}
.overlayBox button{margin-top:15px}
#boom{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6) rotate(-7deg);
z-index:35;opacity:0;pointer-events:none;color:#ffe331;font:900 clamp(48px,10vw,140px) Impact;
text-shadow:7px 7px #ff2d88,12px 12px #000;transition:.14s}
#boom.show{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(-7deg)}
#scan{position:absolute;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(to bottom,transparent 0 3px,#0002 4px);mix-blend-mode:multiply}
@media(max-width:800px){
  /* Gameplay remains the same 16:9 composition; only UI scales for phones. */
  #hud{gap:5px;top:4px;left:4px;right:4px}
  .panel{padding:5px 7px;border-width:2px}
  .playerPanel{width:120px}
  .scoreLine{font-size:11px}.hearts{font-size:18px}.stageLine{font-size:13px}
  .bar{height:12px}
  #controls{bottom:8px;padding:0 8px}
  .ctrl{width:58px;height:58px;font-size:14px}.ctrl.action{width:70px}
  #taunt{right:4vw;top:18vh;padding:10px 14px;font-size:22px}
}
</style>
</head>
<body>
<div id="app">
  <div id="title" class="screen active">
    <div id="titleArt" class="art"></div>
    <div class="titleUI">
      <button id="start" class="press">PRESS START / INSERT COIN</button>
      <div class="subtitle">ARROWS / A-D • SPACE JUMP • X ATTACK • ON-SCREEN CONTROLS ENABLED</div>
    </div>
  </div>

  <div id="play" class="screen">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="panel playerPanel">
        <div class="hearts" id="hearts">♥♥♥</div>
        <div class="scoreLine">SCORE <span id="score">000000</span></div>
        <div class="scoreLine">LIVES <span id="lives">3</span></div>
      </div>
      <div class="panel centerPanel">
        <div class="stageLine" id="stageName">STAGE 1: SUBURBAN SLOPE</div>
        <div class="scoreLine">GRAMAGLUTIDE</div>
        <div class="bar"><div class="fill" id="bossFill" style="width:100%"></div></div>
        <div class="scoreLine">THICC METER</div>
        <div class="bar"><div class="fill" id="thiccFill" style="width:0%"></div></div>
      </div>
    </div>
    <div id="taunt">FAT ASS!</div>
    <div id="stageCard"><div class="card"><h2 id="cardTitle"></h2><p id="cardSub"></p></div></div>
    <div id="controls">
      <div class="grp"><button class="ctrl" data-key="ArrowLeft">◀</button><button class="ctrl" data-key="ArrowRight">▶</button></div>
      <div class="grp"><button class="ctrl action" data-key="Space">JUMP</button><button class="ctrl action" data-key="KeyX">HIT</button></div>
    </div>
  </div>

  <div id="gameOver"><div class="overlayBox"><h1>GAME OVER</h1><div class="stageLine">GRANDMA KEEPS THE HILL</div><button class="press" onclick="location.reload()">TRY AGAIN</button></div></div>
  <div id="win"><div class="overlayBox"><h1>HILL DETHRONED!</h1><div class="stageLine">QUEEN OF CARB CONTROL DEFEATED</div><button class="press" onclick="location.reload()">PLAY AGAIN</button></div></div>
  <div id="boom">THICC EXPLOSION!</div><div id="scan"></div>
</div>

<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const title=document.getElementById('title'),play=document.getElementById('play');
const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),heartsEl=document.getElementById('hearts');
const bossFill=document.getElementById('bossFill'),thiccFill=document.getElementById('thiccFill'),stageName=document.getElementById('stageName');
const taunt=document.getElementById('taunt'),stageCard=document.getElementById('stageCard'),cardTitle=document.getElementById('cardTitle'),cardSub=document.getElementById('cardSub');

const stageDefs=[
 {name:'STAGE 1: SUBURBAN SLOPE',img:'assets/stage1.jpg',boss:100,rate:1.20,sub:'DODGE THE VIALS. CLIMB THE HILL.'},
 {name:'STAGE 2: RETIREMENT RIOT',img:'assets/stage2.jpg',boss:120,rate:.98,sub:'BINGO BLITZ. SCOOTER MAYHEM.'},
 {name:'FINAL STAGE: MOUNT GRAMAGLUTIDE',img:'assets/final.jpg',boss:160,rate:.75,sub:'NO MORE EXCUSES. TAKE THE HILL.'}
];
const bgImgs=stageDefs.map(s=>{let i=new Image();i.src=s.img;return i});
const keys={};
const VIRTUAL_W=1600,VIRTUAL_H=900;
let view={cw:innerWidth,ch:innerHeight,scale:1,tx:0,ty:0,dpr:1};
let state,last=0,running=false,voiceReady=false,lastTaunt=0;

function resizeCanvas(){
 const dpr=Math.min(devicePixelRatio||1,2);
 const r=canvas.getBoundingClientRect();
 canvas.width=Math.max(1,Math.round(r.width*dpr));
 canvas.height=Math.max(1,Math.round(r.height*dpr));
 const scale=Math.max(r.width/VIRTUAL_W,r.height/VIRTUAL_H); // cover: preserve art proportions, crop only
 view={cw:r.width,ch:r.height,scale,tx:(r.width-VIRTUAL_W*scale)/2,ty:(r.height-VIRTUAL_H*scale)/2,dpr};
}
addEventListener('resize',resizeCanvas);
addEventListener('orientationchange',()=>setTimeout(resizeCanvas,120));


function reset(){
 state={stage:0,score:0,lives:3,thicc:0,bossHP:100,bossMax:100,time:0,spawn:0,cam:0,shake:0,exploding:false,
 player:{x:800,y:760,vx:0,vy:0,w:58,h:82,onGround:false,inv:0,attack:0,facing:1},
 hazards:[],fx:[]};
 setStage(0,true);
}
function setStage(n,first=false){
 state.stage=n;state.bossMax=stageDefs[n].boss;state.bossHP=state.bossMax;
 state.hazards=[];state.spawn=0;state.player.x=800;state.player.y=760;state.player.vx=state.player.vy=0;state.cam=0;
 stageName.textContent=stageDefs[n].name;
 cardTitle.textContent=stageDefs[n].name;cardSub.textContent=stageDefs[n].sub;
 stageCard.classList.add('show');setTimeout(()=>stageCard.classList.remove('show'),first?1800:1500);
}
function start(){
 resizeCanvas();
 reset();title.classList.remove('active');play.classList.add('active');running=true;last=performance.now();
 voiceReady=true;setTimeout(()=>grandmaYell(true),1000);requestAnimationFrame(loop);
}
document.getElementById('start').onclick=start;
resizeCanvas();

addEventListener('keydown',e=>{
 keys[e.code]=true;
 if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
});
addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('.ctrl').forEach(b=>{
 const k=b.dataset.key;
 const dn=e=>{e.preventDefault();keys[k]=true;b.classList.add('down')};
 const up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('down')};
 b.addEventListener('pointerdown',dn);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);
});

function grandmaYell(force=false){
 const now=Date.now();if(!force&&now-lastTaunt<4200)return;lastTaunt=now;
 taunt.classList.add('show');setTimeout(()=>taunt.classList.remove('show'),1100);
 try{
  if(!voiceReady||!('speechSynthesis'in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance('Fat ass!');
  const vs=speechSynthesis.getVoices();
  const v=vs.find(x=>/Samantha|Victoria|Zira|Ava|Karen|Susan|female/i.test(x.name));if(v)u.voice=v;
  u.rate=.78;u.pitch=1.12;u.volume=1;speechSynthesis.speak(u);
 }catch(e){}
}
let ac;function beep(freq=120,d=.08){
 try{ac=ac||new(AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}
}

function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){
 const s=state,p=s.player,def=stageDefs[s.stage];s.time+=dt;
 const climbProgress=Math.max(0,Math.min(1,(p.x-220)/(1160-220)));
 const climbThicc=climbProgress*72;
 const effectiveThicc=Math.max(s.thicc,climbThicc);
 const heavy=1+effectiveThicc/72,spd=(keys.ShiftLeft?410:320)/heavy;
 if(keys.ArrowLeft||keys.KeyA){p.vx-=900*dt;p.facing=-1}
 if(keys.ArrowRight||keys.KeyD){p.vx+=900*dt;p.facing=1}
 p.vx*=Math.pow(.02,dt);p.vx=Math.max(-spd,Math.min(spd,p.vx));
 if((keys.Space||keys.ArrowUp)&&p.onGround){p.vy=-590/heavy;p.onGround=false;keys.Space=false;keys.ArrowUp=false;beep(420,.04)}
 if(keys.KeyX&&p.attack<=0){p.attack=.24;keys.KeyX=false;beep(180,.05)}
 if(p.attack>0)p.attack-=dt;if(p.inv>0)p.inv-=dt;
 p.vy+=1180*dt*heavy;p.x+=p.vx*dt;p.y+=p.vy*dt;

 // sloped invisible terrain that matches climbing composition
 const groundY=820 - (p.x-220)*.52;
 if(p.y+p.h>=groundY){p.y=groundY-p.h;p.vy=0;p.onGround=true}
 p.x=Math.max(180,Math.min(1380,p.x));
 // Climbing itself makes the challenger visibly THICC.
 const climbFill=Math.max(0,Math.min(92,((p.x-220)/(1160-220))*92));
 if(climbFill>s.thicc)s.thicc=Math.min(100,s.thicc+dt*7.5);
 if(s.thicc>=100&&!s.exploding){thiccExplosion();return;}

 // Boss attack zone near summit
 if(p.x>1160 && p.y<310 && p.attack>0){s.bossHP-=55*dt;s.score+=Math.floor(80*dt);s.shake=7}

 s.spawn-=dt;
 if(s.spawn<=0){spawnHazard();s.spawn=def.rate*(.72+Math.random()*.55)}
 for(let i=s.hazards.length-1;i>=0;i--){
   const h=s.hazards[i];h.x+=h.vx*dt;h.y+=h.vy*dt;h.vy+=420*dt;h.rot+=h.vr*dt;
   if(p.attack>0&&Math.hypot((p.x+p.w/2)-h.x,(p.y+p.h/2)-h.y)<90){h.vx=p.facing*620;h.vy=-280;h.friendly=true}
   if(!h.friendly&&rectCircle(p,h)){s.hazards.splice(i,1);hit(h.damage);continue}
   if(h.friendly&&h.x>1180&&h.y<340){s.bossHP-=8;s.score+=250;s.hazards.splice(i,1);burst(h.x,h.y);continue}
   if(h.x<-120||h.x>1720||h.y>1050)s.hazards.splice(i,1)
 }
 if(s.bossHP<=0){
   s.score+=5000;
   if(s.stage<stageDefs.length-1){s.stage++;s.thicc=Math.max(0,s.thicc-28);setStage(s.stage)}
   else{running=false;document.getElementById('win').style.display='flex';}
 }
 if(s.lives<=0){running=false;document.getElementById('gameOver').style.display='flex'}
 updateHud();
}
function spawnHazard(){
 const p=state.player;
 const types=['VIAL','DONUT','FLAMINGO','SCOOTER','TRAY'];
 let type=types[Math.floor(Math.random()*types.length)],sx=1250+Math.random()*120,sy=150+Math.random()*80;
 let dx=p.x-sx,dy=p.y-sy,m=Math.hypot(dx,dy),speed=360+state.stage*55+Math.random()*80;
 state.hazards.push({type,x:sx,y:sy,vx:dx/m*speed-80,vy:dy/m*speed-150,vr:(Math.random()-.5)*8,rot:0,r:type==='SCOOTER'?28:20,damage:type==='VIAL'?24:18,friendly:false});
}
function hit(d){
 const s=state,p=s.player;if(p.inv>0)return;p.inv=1;s.thicc=Math.min(100,s.thicc+d);p.vx=-320;p.vy=-270;s.shake=12;beep(90,.15);grandmaYell();
 if(s.thicc>=100&&!s.exploding){thiccExplosion();}
}

function thiccExplosion(){
 const s=state,p=s.player;if(s.exploding)return;
 s.exploding=true;s.shake=28;beep(58,.35);
 const boom=document.getElementById('boom');boom.classList.add('show');
 for(let i=0;i<80;i++)s.fx.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:(Math.random()-.5)*900,vy:(Math.random()-.5)*900,l:.8+Math.random()*.8,big:true});
 setTimeout(()=>{
   boom.classList.remove('show');
   s.lives--;s.thicc=22;p.x=300;p.y=650;p.vx=p.vy=0;p.inv=2.2;s.exploding=false;
   if(s.lives<=0){running=false;document.getElementById('gameOver').style.display='flex'}
 },850);
}

function rectCircle(p,h){
 let nx=Math.max(p.x,Math.min(h.x,p.x+p.w)),ny=Math.max(p.y,Math.min(h.y,p.y+p.h));
 return (h.x-nx)**2+(h.y-ny)**2<h.r*h.r;
}
function burst(x,y){for(let i=0;i<14;i++)state.fx.push({x,y,vx:(Math.random()-.5)*340,vy:(Math.random()-.5)*340,l:.6})}
function updateHud(){
 scoreEl.textContent=String(state.score).padStart(6,'0');livesEl.textContent=state.lives;heartsEl.textContent='♥'.repeat(Math.max(0,state.lives));
 bossFill.style.width=Math.max(0,state.bossHP/state.bossMax*100)+'%';thiccFill.style.width=state.thicc+'%';
}

function draw(){
 const s=state,p=s.player,img=bgImgs[s.stage];
 const {dpr,scale,tx,ty}=view;
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*tx,dpr*ty);
 ctx.save();
 if(s.shake>0){ctx.translate((Math.random()-.5)*s.shake,(Math.random()-.5)*s.shake);s.shake*=.86}
 // Same 16:9 game art on PC and mobile; mobile crops edges instead of stretching.
 if(img.complete){ctx.drawImage(img,0,0,VIRTUAL_W,VIRTUAL_H);}
 // gameplay readability gradient
 let g=ctx.createLinearGradient(0,0,0,900);g.addColorStop(0,'#0002');g.addColorStop(.5,'#0000');g.addColorStop(1,'#0007');ctx.fillStyle=g;ctx.fillRect(0,0,1600,900);

 // hill path glow
 ctx.strokeStyle='#ffe45e55';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(240,810);ctx.quadraticCurveTo(790,560,1230,230);ctx.stroke();

 for(const h of s.hazards)drawHazard(h);
 drawHero(p);

 for(let i=s.fx.length-1;i>=0;i--){let f=s.fx[i];f.l-=.016;f.x+=f.vx*.016;f.y+=f.vy*.016;ctx.globalAlpha=Math.max(0,f.l);ctx.fillStyle=f.big?(Math.random()>.5?'#ff2dbf':'#ffe45e'):'#ffe45e';let sz=f.big?12:7;ctx.fillRect(f.x,f.y,sz,sz);if(f.l<=0)s.fx.splice(i,1)}
 ctx.globalAlpha=1;ctx.restore();
}
function drawHero(p){
 ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);
 const climbProgress=Math.max(0,Math.min(1,(p.x-220)/(1160-220)));
 const visualThicc=Math.max(state.thicc,climbProgress*92);
 const thX=1+visualThicc/92*.78;
 const thY=1+visualThicc/100*.12;
 ctx.scale(thX,thY);
 if(p.inv>0&&Math.floor(p.inv*12)%2===0)ctx.globalAlpha=.35;
 // shadow
 ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(0,43,34,12,0,0,Math.PI*2);ctx.fill();
 // legs
 ctx.fillStyle='#252331';ctx.fillRect(-22,20,18,38);ctx.fillRect(4,20,18,38);
 ctx.fillStyle='#ded8c9';ctx.fillRect(-23,52,20,9);ctx.fillRect(3,52,20,9);
 // torso jersey
 ctx.fillStyle='#9b1f1f';ctx.beginPath();ctx.roundRect(-32,-28,64,56,14);ctx.fill();
 ctx.fillStyle='#eee';ctx.font='bold 25px Impact';ctx.textAlign='center';ctx.fillText('2XL',0,9);
 // arms
 ctx.fillStyle='#b16f4e';ctx.fillRect(-43,-20,13,42);ctx.fillRect(30,-20,13,42);
 // head + bandana
 ctx.fillStyle='#b16f4e';ctx.beginPath();ctx.arc(0,-43,20,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#c21c52';ctx.fillRect(-22,-57,44,9);
 ctx.fillStyle='#111';ctx.fillRect(p.facing>0?9:-13,-46,5,5);
 if(p.attack>0){ctx.strokeStyle='#29e9ff';ctx.lineWidth=8;ctx.beginPath();ctx.arc(p.facing*38,-5,36,-1.3,1.3);ctx.stroke()}
 ctx.restore();
}
function drawHazard(h){
 ctx.save();ctx.translate(h.x,h.y);ctx.rotate(h.rot);
 if(h.type==='VIAL'){
   ctx.shadowBlur=20;ctx.shadowColor='#b5ff31';ctx.fillStyle='#dfffd0';ctx.fillRect(-9,-25,18,45);ctx.fillStyle='#63ff42';ctx.fillRect(-7,-10,14,24);ctx.fillStyle='#111';ctx.font='bold 8px Arial';ctx.rotate(-Math.PI/2);ctx.fillText('GRAMAGLUTIDE',-20,3)
 }else if(h.type==='DONUT'){
   ctx.fillStyle='#f6a44c';ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();ctx.fillStyle='#ff5fba';ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill();ctx.fillStyle='#382338';ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fill()
 }else if(h.type==='FLAMINGO'){
   ctx.strokeStyle='#ff55ad';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,-4,13,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(-3,9);ctx.lineTo(-10,30);ctx.moveTo(5,8);ctx.lineTo(12,30);ctx.stroke()
 }else if(h.type==='SCOOTER'){
   ctx.fillStyle='#b5b5bd';ctx.fillRect(-30,-6,42,15);ctx.fillRect(8,-33,7,28);ctx.beginPath();ctx.arc(-18,15,10,0,7);ctx.arc(14,15,10,0,7);ctx.fill()
 }else{
   ctx.fillStyle='#d6d0bd';ctx.fillRect(-28,-12,56,24);ctx.fillStyle='#e4953a';ctx.fillRect(-19,-21,15,10);ctx.fillStyle='#75d157';ctx.fillRect(6,-21,15,10)
 }
 ctx.restore();
}
